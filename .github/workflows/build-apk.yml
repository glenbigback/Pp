name: Build Quest APK

on:
  workflow_dispatch:        # the "Run workflow" button
  push:
    paths: ["project.zip"]  # or just upload a new project.zip

env:
  GODOT: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK pieces Godot 4.3 wants
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Godot + export templates
        run: |
          B=https://github.com/godotengine/godot/releases/download/${GODOT}-stable
          curl -fsSL -o godot.zip $B/Godot_v${GODOT}-stable_linux.x86_64.zip
          curl -fsSL -o templates.tpz $B/Godot_v${GODOT}-stable_export_templates.tpz
          unzip -q godot.zip && mv Godot_v${GODOT}-stable_linux.x86_64 /usr/local/bin/godot && chmod +x /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT}.stable
          unzip -q templates.tpz -d tpl && cp -r tpl/templates/* ~/.local/share/godot/export_templates/${GODOT}.stable/

      - name: Unpack the project
        run: |
          mkdir game && unzip -q project.zip -d game
          test -f game/project.godot || { echo "project.godot not at the top of project.zip"; exit 1; }

      - name: OpenXR Vendors plugin (Meta Quest loader)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # newest 3.x release = the line made for Godot 4.3
          URL=$(gh api repos/GodotVR/godot_openxr_vendors/releases --paginate \
            --jq '[.[] | select(.tag_name|startswith("3.")) | .assets[] | select(.name|test("^godotopenxrvendors.*\\.zip$")) | select(.name|test("debug")|not)][0].browser_download_url')
          echo "plugin: $URL"
          curl -fsSL -o vendors.zip "$URL" && unzip -q vendors.zip -d vendors
          SRC=$(find vendors -type d -name godotopenxrvendors | head -1)
          mkdir -p game/addons && cp -r "$SRC" game/addons/godotopenxrvendors
          printf '\n[editor_plugins]\n\nenabled=PackedStringArray("res://addons/godotopenxrvendors/plugin.cfg")\n' >> game/project.godot
          # tick the Meta plugin in the preset (names can differ between plugin versions)
          printf 'plugins/GodotOpenXRMeta=true\nmeta_xr_features/quest_support=2\n' >> game/export_presets.cfg

      - name: Android build template + signing
        run: |
          mkdir -p game/android/build
          unzip -q ~/.local/share/godot/export_templates/${GODOT}.stable/android_source.zip -d game/android/build
          echo "${GODOT}.stable" > game/android/.build_version
          touch game/android/build/.gdignore
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT}.tres <<EOS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOS
          sed -i 's/^          //' ~/.config/godot/editor_settings-${GODOT}.tres

      - name: Export
        run: |
          cd game
          godot --headless --import || true
          mkdir -p build
          godot --headless --export-debug "Meta Quest" build/GorillaLocomotion.apk

      - name: Check the APK (Quest + internet entries)
        run: python3 game/tools/check_apk.py game/build/GorillaLocomotion.apk || true

      - uses: actions/upload-artifact@v4
        with:
          name: GorillaLocomotion-apk
          path: game/build/GorillaLocomotion.apk
